name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test # inclut le test de budget de bundle (build --production + tailles)
      - run: node esbuild.mjs --production
      - run: npx --yes @vscode/vsce package --no-dependencies -o agenticenv-chat.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: agenticenv-chat-vsix
          path: agenticenv-chat.vsix
